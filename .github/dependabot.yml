version: 2
updates:
  # Backend npm dependencies
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: daily
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - npm
      - backend

  # Frontend npm dependencies
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: daily
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - npm
      - frontend

  # GitHub Actions workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
